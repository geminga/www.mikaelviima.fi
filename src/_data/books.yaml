  literal_title_gloss: "Dangerous Gurus"
  gloss_is_official_title: false
  card_summary: "Why do people surrender judgment to destructive leaders?\n\n**Vaaralliset gurut** examines manipulation, coercive control, cult dynamics and the psychological machinery that allows charismatic leaders to dominate followers — sometimes long after outsiders can already see the danger.\n\nThe book moves between international and Finnish cases and asks a practical question: how can manipulation be recognized before the cost becomes irreversible?"
  page_intro: "## Manipulation rarely begins by looking like manipulation.\n\nPublished under the author's real name, **Manne Laukkanen**, **Vaaralliset gurut** is a nonfiction examination of destructive leaders, coercive control, cult dynamics and psychological exploitation.\n\nWhy do followers surrender autonomy?\n\nWhy can danger remain visible for years before a group acts?\n\nWhy do even intelligent people continue to defend systems that are harming them?\n\nAnd how can the mechanisms of manipulation be recognized early enough to matter?\n\nThe book draws on international and Finnish cases and connects them to the psychology of persuasion, dependence and control."
  review_quote: ""
  review_source: ""
  review_note: ""
