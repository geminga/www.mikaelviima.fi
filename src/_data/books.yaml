  gloss_is_official_title: false
  card_summary: "A serial-arson investigation collides with a sequence of murders. One of the dead keeps producing information after death, and the trail leads toward people connected with national security.\n\nSusi responds in the only way he knows how: with experience, speed, recklessness and increasingly unconventional tools.\n\nThe investigation widens.\n\nSo does the damage."
  page_intro: "## Aarni Susi removes the mask. What remains is not reassuring.\n\nA serial-arson case and a sequence of murders land on Susi's desk at the same time.\n\nThen one of the dead begins to speak.\n\nThe information left behind draws the investigation toward institutions connected with national security and forces Susi into a pursuit in which conventional caution is a liability.\n\nExperience helps.\n\nSo does recklessness.\n\nSo does technology.\n\nNone of them are free.\n\n**Rekyyli** pushes the Aarni Susi series further into the territory between effectiveness and disintegration: what happens when the traits that make a damaged investigator dangerous also make him useful?"
