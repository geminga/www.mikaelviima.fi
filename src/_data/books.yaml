  gloss_is_official_title: false
  card_summary: "A violent-crime investigator wakes at an airport in a foreign country with fresh blood under his fingernails and no reliable memory of how it got there.\n\nBack in a winter-dark Helsinki, fragments begin to return: a mutilated body in the water, old records of extreme violence, a graveyard at night, a trail of blood.\n\nAarni Susi has spent his career hunting damaged minds.\n\nNow the least trustworthy one may be his own."
  page_intro: "## Aarni Susi is one step away from evil. What if he already crossed it?\n\nAarni Susi comes to at an airport abroad.\n\nThere is fresh blood under his fingernails.\n\nHe does not know whose.\n\nWhat returns to him comes in fragments: a disfigured body in shallow water, archival material describing old brutality, a graveyard at night, blood, darkness.\n\nSusi is a violent-crime investigator used to reconstructing other people's actions from the traces they leave behind. This time the traces may point inward.\n\nSet against a winter-dark Helsinki, **Verijälki** begins the Aarni Susi series: hard-boiled crime fiction in which the investigator's own cognition is not a safe place to stand."
  review_quote: "The spirit of hard-boiled crime arrives in 2020s Helsinki."
  review_source: "Helsingin Sanomat"
  review_note: "translated from Finnish"

