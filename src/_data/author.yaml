bios:
  one_line: "Mikael Viima is a Finnish poet and author of psychological noir, with a PhD in psychology and books published by WSOY and Otava."
  fifty_word: "Mikael Viima is a Finnish poet and novelist — the literary name of Manne Mikael Laukkanen. His debut English-language poetry collection, FEED, is currently in development. His Finnish-language crime novels Verijälki and Rekyyli, published by WSOY, combine hard-boiled plotting with psychological instability. He holds a PhD in psychology."
  hundred_word: "Mikael Viima is a Finnish poet and novelist — the literary name of Manne Mikael Laukkanen. His first English-language poetry collection, FEED, is currently in development, drawn from a larger body of work spanning science, mortality, damage and dark humor. In Finnish, he is the author of the hard-boiled Aarni Susi crime novels Verijälki (2022) and Rekyyli (2023), published by WSOY, and — under his own name — the nonfiction book Vaaralliset gurut (Otava, 2024), on manipulation and coercive control. He holds a PhD in psychology, with doctoral work connected to serial-criminal profiling, and a long background in technology and data."

