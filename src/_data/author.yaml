bios:
  one_line: "Mikael Viima is a Finnish author of psychological noir and poetry, with a PhD in psychology and books published by WSOY and Otava."
  fifty_word: "Mikael Viima is the literary name of Finnish writer Manne Mikael Laukkanen. He is the author of the Aarni Susi crime novels Verijälki and Rekyyli, published by WSOY, and holds a PhD in psychology. His current work includes English-language poetry and fiction."
  hundred_word: "Mikael Viima is the literary name of Finnish writer Manne Mikael Laukkanen. His crime novels Verijälki (2022) and Rekyyli (2023), published by WSOY, combine hard-boiled crime fiction with psychological instability, documentary realism and contemporary Helsinki. Under his real name, Laukkanen is also the author of the nonfiction book Vaaralliset gurut (Otava, 2024), an examination of manipulation, coercive control and dangerous leaders. He holds a PhD in psychology, with doctoral work connected to serial-criminal profiling, and has a long background in technology and data. His current literary focus includes poetry and English-language fiction."

